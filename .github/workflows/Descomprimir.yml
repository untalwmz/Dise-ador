name: Auto-descomprimir ZIP en la raíz
on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir todos los zip (excluyendo .github)
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Descomprimiendo $f..."
            unzip -o "$f" -d . -x ".github/*"
            rm "$f"
          done

      - name: Commit resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-descomprimir zip $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push
