name: Topógrafo GPS - Compilar APK

on:
  push:
    paths:
      - "topografo-gps/**"
      - ".github/workflows/topografo-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topografo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topografo-gps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: topografo-gps/package-lock.json

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El runner de GitHub ya trae el Android SDK instalado. (La acción
      # android-actions/setup-android@v3 falla hoy con "Failed to find package 'tools'").
      - name: Verificar Android SDK del runner
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::No se encontró el Android SDK en $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-topografo-${{ runner.os }}-${{ hashFiles('topografo-gps/package-lock.json') }}
          restore-keys: gradle-topografo-${{ runner.os }}-

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de cálculos (área, UTM, rumbos)
        run: npm test

      - name: Generar proyecto nativo Android
        env:
          CI: "1"
        run: npx expo prebuild -p android --no-install --clean

      - name: Compilar APK (release)
        working-directory: topografo-gps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          NAME="topografo-gps-v${VERSION}-build${{ github.run_number }}"
          cp "$SRC" "$NAME.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=topografo-gps/$NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publicar Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.apk.outputs.name }}.apk
          make_latest: true
          body: |
            ## Topógrafo GPS v${{ steps.apk.outputs.version }}

            **Descarga:** `${{ steps.apk.outputs.name }}.apk` (en *Assets*, abajo).

            ### Instalación en Android
            1. Descarga el APK en el teléfono.
            2. Ábrelo y permite «Instalar apps desconocidas» si Android lo pide.
            3. Si tenías una versión anterior, se actualiza conservando tus lotes.

            Rama: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
