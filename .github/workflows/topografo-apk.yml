name: Topógrafo GPS - Compilar APK

on:
  push:
    paths:
      - "topografo-gps/**"
      - ".github/workflows/topografo-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topografo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topografo-gps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: topografo-gps/package-lock.json

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-topografo-${{ runner.os }}-${{ hashFiles('topografo-gps/package-lock.json') }}
          restore-keys: gradle-topografo-${{ runner.os }}-

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de cálculos (área, UTM, rumbos)
        run: npm test

      - name: Generar proyecto nativo Android
        env:
          CI: "1"
        run: npx expo prebuild -p android --no-install --clean

      - name: Compilar APK (release)
        working-directory: topografo-gps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          DEST="topografo-gps-${VERSION}-${{ github.run_number }}.apk"
          cp "$SRC" "$DEST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=topografo-gps/$DEST" >> "$GITHUB_OUTPUT"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: topografo-gps-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publicar Release (solo en main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: topografo-v${{ steps.apk.outputs.version }}-${{ github.run_number }}
          name: "Topógrafo GPS v${{ steps.apk.outputs.version }} (#${{ github.run_number }})"
          body: |
            APK compilado automáticamente desde `topografo-gps/`.
            Commit: ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
