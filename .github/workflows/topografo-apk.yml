name: Topógrafo GPS - Compilar APK

on:
  push:
    paths:
      - "topografo-gps/**"
      - ".github/workflows/topografo-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topografo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.apk.outputs.name }}
      version: ${{ steps.apk.outputs.version }}
    defaults:
      run:
        working-directory: topografo-gps

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: topografo-gps/package-lock.json

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El runner de GitHub ya trae el Android SDK instalado. (La acción
      # android-actions/setup-android@v3 falla hoy con "Failed to find package 'tools'").
      - name: Verificar Android SDK del runner
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::No se encontró el Android SDK en $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-topografo-${{ runner.os }}-${{ hashFiles('topografo-gps/package-lock.json') }}
          restore-keys: gradle-topografo-${{ runner.os }}-

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de cálculos (área, UTM, rumbos)
        run: npm test

      - name: Generar proyecto nativo Android
        env:
          CI: "1"
        run: npx expo prebuild -p android --no-install --clean

      - name: Compilar APK (release)
        working-directory: topografo-gps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          NAME="topografo-gps-v${VERSION}-build${{ github.run_number }}"
          cp "$SRC" "$NAME.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=topografo-gps/$NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30


  # Instala el APK en un emulador Android, lo abre y recorre las pantallas.
  # Si la app se cierra, el workflow falla y NO se publica el Release.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}

      - name: Habilitar KVM (aceleración del emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke-test.sh

      - name: Subir capturas y logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ github.run_number }}
          path: smoke/
          retention-days: 14

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}

      - name: Publicar Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.name }}.apk
          make_latest: true
          body: |
            ## Topógrafo GPS v${{ needs.build.outputs.version }}

            **Descarga:** `${{ needs.build.outputs.name }}.apk` (en *Assets*, abajo).

            ### Instalación en Android
            1. Descarga el APK en el teléfono.
            2. Ábrelo y permite «Instalar apps desconocidas» si Android lo pide.
            3. Si tenías una versión anterior, se actualiza conservando tus lotes.

            ✅ Probado automáticamente en un emulador Android (abre la app y recorre las pantallas).

            Rama: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
          files: ${{ needs.build.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
